command:
  - "python"
  - "weather_mcp_server.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: DATABRICKS_APP_DISABLE_OAUTH
    value: "true"

default_source_ip_access_rules:
  - allow_public_access: true
